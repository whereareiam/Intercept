name: InterceptProbe
main: me.whereareiam.intercept.testing.probe.ProbePlugin
version: '1'
api-version: '1.21'
description: A plugin as the scenarios see others, with its own texts and its own translator.
softdepend: [Intercept]
commands:
  probe:
    description: Sends a key Intercept knows as well.
  probe-own:
    description: Sends a key only the probe knows.
  probe-language:
    description: Tells the sender the language they chose, as Intercept's API reports it.
