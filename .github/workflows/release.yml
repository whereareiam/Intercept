name: Release
run-name: "${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Verify {0}', inputs.release-tag) }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Tag of an existing release to verify again, for example v1.0.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      body: ${{ steps.release.outputs.body }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Read release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          # The release's name comes from the subtitle and its changes from the body.
          if jq -e '(.body // "") | contains("[Short subtitle]") or contains("[1-2 sentence summary")' <<<"$release" >/dev/null; then
            echo "::error::Release $TAG still has the subtitle or summary placeholder of the draft; fill in .github/release-notes.md or edit the release, then run this workflow again."
            exit 1
          fi
          delimiter="release-$(openssl rand -hex 16)"
          {
            echo "tag=$(jq -r '.tag_name' <<<"$release")"
            echo "name=$(jq -r '.name // ""' <<<"$release")"
            echo "url=$(jq -r '.html_url' <<<"$release")"
            echo "body<<$delimiter"
            jq -r '.body // ""' <<<"$release"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: resolve
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.tag }}
      distribution: true

  # A manual run only verifies again; Maven and the GitHub release keep what the release published.
  publish:
    name: Publish
    needs: verify
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}

  attach:
    name: Attach files to the release
    needs: [resolve, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: intercept-plugins-${{ needs.verify.outputs.version }}
          path: distribution

      - name: Upload files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" distribution/* --clobber --repo "$GITHUB_REPOSITORY"
