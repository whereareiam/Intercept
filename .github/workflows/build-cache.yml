name: Build cache
run-name: "Build cache of ${{ github.ref_name }}"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests read the caches of dev but never write them, so the checks would compile everything and
  # download Anvil's servers again. A job restores the latest Gradle entry of a job with its own id first, which
  # makes the scenario jobs, the longest of the checks, pick this one.
  scenarios:
    name: Prepare for the checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: whereareiam/devops/primitive/setup/gradle@v3

      - uses: whereareiam/anvil-actions/setup@v1

      # Every cacheable task the checks run before their tests.
      - name: Compile the project, its tests and scenarios
        run: ./gradlew --no-daemon testClasses assembleDistribution anvilClasses :intercept-testing:probeJar

      # The marker scenarios run once on each platform, which starts every server the suites use, so Anvil saves
      # them for the scenario jobs.
      - name: Prepare the servers of the scenarios
        run: ./gradlew --no-daemon :intercept-testing:anvilInterceptionTest --tests '*MarkerTest*'
