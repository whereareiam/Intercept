type: MESSAGE

items:
  permission-error:
    translations:
      en_US: "You lack permission: <p:permission>"
      de_DE: "Keine Berechtigung: <p:permission>"
    regex:
      - pattern: "You don't have permission:\\s*([\\w.]+)"
        placeholders:
          permission: "$1"
        priority: 10
      - pattern: "(?i)insufficient permission:\\s*([\\w.]+)"
        placeholders:
          permission: "$1"
        priority: 5

  player-joined:
    translations:
      en_US: "Welcome, <p:name>!"
    regex:
      - pattern: "Player (\\w+) joined the game"
        placeholders:
          name: "$1"
        priority: 10
      - pattern: "(\\w+) has joined"
        placeholders:
          name: "$1"
        priority: 5

  priority-test:
    translations:
      en_US: "High priority: <p:word>"
    regex:
      - pattern: "test (\\w+)"
        placeholders:
          word: "$1"
        priority: 20
      - pattern: "test.*"
        placeholders:
          word: "should not match"
        priority: 5

  priority-test-low:
    translations:
      en_US: "Low priority: <p:word>"
    regex:
      - pattern: "test (\\w+)"
        placeholders:
          word: "$1"
        priority: 5