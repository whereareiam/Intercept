type: MESSAGE

entries:
  permission-error:
    translations:
      en_US: "You lack permission: <p:permission>"
      de_DE: "Keine Berechtigung: <p:permission>"
    regex:
      - pattern: "You don't have permission:\\s*([\\w.]+)"
        placeholders:
          permission: "$1"
        priority: 10
      - pattern: "(?i)insufficient permission:\\s*([\\w.]+)"
        placeholders:
          permission: "$1"
        priority: 5

  player-joined:
    translations:
      en_US: "Welcome, <p:name>!"
    regex:
      - pattern: "Player (\\w+) joined the game"
        placeholders:
          name: "$1"
        priority: 10
      - pattern: "(\\w+) has joined"
        placeholders:
          name: "$1"
        priority: 5